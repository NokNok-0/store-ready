name: freshness

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/validate.mjs > result.txt 2>&1 || echo "stale=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create freshness --color FBCA04 --force
          if ! gh issue list --label freshness --state open --json number --jq '.[0].number' | grep -q .; then
            gh issue create --title "Store rules need re-checking" --label freshness --body "$(cat result.txt)"
          fi
