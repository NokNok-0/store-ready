name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/validate.mjs --skip-freshness
      - run: npm test
        working-directory: cli
      - run: node cli/bin/store-ready.mjs check examples/habit-tracker --strict
